name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: festiva
          POSTGRES_PASSWORD: festiva_dev
          POSTGRES_DB: festiva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://festiva:festiva_dev@localhost:5432/festiva_test
      TEST_DATABASE_URL: postgresql://festiva:festiva_dev@localhost:5432/festiva_test
      ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Run Alembic migrations on Postgres
        run: python -m alembic upgrade head

      - name: Run tests on Postgres (including test_changes.py, excluding e2e)
        run: python -m pytest tests/ --ignore=tests/e2e -v

      - name: Run Phase 3 Brief Parser Evals
        run: python tests/evals/eval_brief_parser.py --replay

      - name: Run Phase 5 Plan Diff Evals
        run: python tests/evals/eval_plan_diff.py --replay

